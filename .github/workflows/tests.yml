name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements-tools.txt
      - run: python scripts/validate_worker_config.py
      - name: Seed non-secret build-context probes
        run: |
          mkdir -p data/private
          printf 'SYNTHETIC_BUILD_CONTEXT_PROBE' > .env.worker-build-probe
          printf 'SYNTHETIC_BUILD_CONTEXT_PROBE' > app/.env.worker-build-probe
          printf 'SYNTHETIC_BUILD_CONTEXT_PROBE' > data/private/build-probe.txt
      - name: Build pinned amd64 OCR worker image
        run: docker build --platform linux/amd64 --file Dockerfile.worker --tag paper-trail-worker:ci .
      - name: Offline, resource-bounded container and shutdown verification
        shell: bash
        run: |
          mkdir -p work
          docker run --rm --network none --read-only --memory 1g --cpus 1 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=256m --entrypoint python paper-trail-worker:ci scripts/container_worker_smoke.py | tee work/container-worker-results.json
          python - <<'PY'
          import json,subprocess,os,hashlib
          from pathlib import Path
          path=Path('work/container-worker-results.json');report=json.loads(path.read_text())
          assert report['passed'] and all(check['passed'] for check in report['checks'])
          report['image_id']=subprocess.check_output(['docker','image','inspect','paper-trail-worker:ci','--format','{{.Id}}'],text=True).strip()
          report['source_commit']=os.environ['GITHUB_SHA']
          report['dockerfile_sha256']=hashlib.sha256(Path('Dockerfile.worker').read_bytes()).hexdigest()
          path.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-image-evaluation
          path: work/container-worker-results.json
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-ocr.txt
      - run: python -m pip check
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - run: npm ci --prefix tests/frontend --ignore-scripts --no-audit --no-fund
      - run: python -m pytest tests/test_ocr.py tests/test_ocr_jobs.py -q
      - run: python scripts/evaluate_ocr.py --report work/ocr-results.json
      - run: python scripts/test_frontend.py --report work/frontend-ocr-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-evaluation
          path: |
            work/ocr-results.json
            work/frontend-ocr-results.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paper_trail_test
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d paper_trail_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tester:synthetic-ci-only@localhost:5432/paper_trail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest tests/test_postgres.py -q
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: python scripts/evaluate.py
      - run: python scripts/benchmark.py --report work/benchmark-results.json
      - run: python scripts/resource_benchmark.py --report work/resource-results.json
      - run: python scripts/evaluate_mcp.py --report work/mcp-results.json
      - run: python scripts/check_deployment_requirements.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-evaluation
          path: work/mcp-results.json
      - name: HTTP smoke and sanity tests
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/api/health && break
            sleep 0.5
          done
          python scripts/smoke.py
