name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-ocr.txt
      - run: python -m pip check
      - run: python -m pytest tests/test_ocr.py -q
      - run: python scripts/evaluate_ocr.py --report work/ocr-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-evaluation
          path: work/ocr-results.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paper_trail_test
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d paper_trail_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tester:synthetic-ci-only@localhost:5432/paper_trail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest tests/test_postgres.py -q
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: python scripts/evaluate.py
      - run: python scripts/benchmark.py --report work/benchmark-results.json
      - run: python scripts/resource_benchmark.py --report work/resource-results.json
      - name: HTTP smoke and sanity tests
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/api/health && break
            sleep 0.5
          done
          python scripts/smoke.py
