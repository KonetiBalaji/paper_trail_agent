name: Hosted mobile smoke
on:
  workflow_dispatch:
  push:
    branches: [hosted-mobile-verification]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.1
      - run: python -m playwright install chromium
      - run: python scripts/hosted_mobile_smoke.py
