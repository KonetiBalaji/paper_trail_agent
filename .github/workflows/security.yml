name: Security gates
on:
  push:
  pull_request:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - run: python -m pip install -r tests/requirements-security.txt
      - name: Install checksum-verified secret scanner
        shell: bash
        run: |
          mkdir -p work/security-tools
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output work/security-tools/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  work/security-tools/gitleaks.tar.gz' | sha256sum --check
          tar -xzf work/security-tools/gitleaks.tar.gz -C work/security-tools gitleaks
      - name: Audit dependencies, full history and tracked files; prove canary detection
        run: python scripts/security_checks.py --gitleaks work/security-tools/gitleaks --report work/security-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-evaluation
          path: work/security-results.json
          if-no-files-found: warn
